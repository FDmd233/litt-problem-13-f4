name: Refresh release assets

on:
  push:
    paths:
      - '.github/workflows/refresh-release-assets.yml'

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Refresh v1.0.0-preprint
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > /tmp/release-notes.md <<'EOF'
          I construct a complex abelian fourfold and an integral surface whose full convolution Tannaka group is the simple group of type F4. I begin with the Fano surface of lines on a smooth cubic threefold with an Eckardt point, quotient its Albanese variety by the elliptic curve of lines through that point, and analyze the resulting intersection complex. The pushforward decomposition and the restriction 27 = 1 + 26 reduce the final identification to the geometry of the Albert representation and the subgroup structure of F4.

          AI-assisted tools were used during manuscript preparation.
          EOF
          gh release edit v1.0.0-preprint --notes-file /tmp/release-notes.md
          gh release upload v1.0.0-preprint output/pdf/Litt_Problem_13_F4.pdf --clobber
      - name: Verify release asset digest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          LOCAL=$(sha256sum output/pdf/Litt_Problem_13_F4.pdf | awk '{print $1}')
          REMOTE=$(gh api repos/${GITHUB_REPOSITORY}/releases/tags/v1.0.0-preprint --jq '.assets[] | select(.name=="Litt_Problem_13_F4.pdf") | .digest' | sed 's/^sha256://')
          test "$LOCAL" = "$REMOTE"
      - name: Remove temporary workflow
        run: |
          rm -f .github/workflows/refresh-release-assets.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Remove temporary release refresh workflow'
          git push
