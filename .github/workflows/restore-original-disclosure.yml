name: Restore original disclosure

on:
  push:
    paths:
      - '.github/workflows/restore-original-disclosure.yml'

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install PDF tools
        run: |
          python3 -m pip install --quiet pymupdf
          sudo apt-get update -qq
          sudo apt-get install -y -qq poppler-utils
      - name: Render before
        run: |
          mkdir -p /tmp/f4-qa
          pdftoppm -f 1 -singlefile -png -r 160 output/pdf/Litt_Problem_13_F4.pdf /tmp/f4-qa/before >/dev/null 2>&1
      - name: Restore statement in PDF
        run: |
          python3 - <<'PY'
          import fitz
          from pathlib import Path
          pdf = Path('output/pdf/Litt_Problem_13_F4.pdf')
          old = 'AI-assisted tools were used during manuscript preparation.'
          new = 'Prepared with assistance from OpenAI.'
          doc = fitz.open(pdf)
          hits = 0
          for page in doc:
              rects = page.search_for(old)
              for r in rects:
                  hits += 1
                  size = 9.0
                  for block in page.get_text('dict')['blocks']:
                      for line in block.get('lines', []):
                          for span in line.get('spans', []):
                              if 'AI-assisted tools were used' in span.get('text', ''):
                                  size = float(span.get('size', 9.0))
                  rr = fitz.Rect(r.x0-1, r.y0-1, r.x1+2, r.y1+2)
                  page.add_redact_annot(rr, fill=(1,1,1))
                  page.apply_redactions()
                  result = page.insert_textbox(rr, new, fontsize=size, fontname='helv', color=(0,0,0), align=fitz.TEXT_ALIGN_LEFT)
                  if result < 0:
                      raise RuntimeError(f'replacement did not fit: {result}')
          if hits != 1:
              raise RuntimeError(f'expected exactly one statement, found {hits}')
          out = Path('/tmp/f4-restored.pdf')
          doc.save(out, garbage=4, deflate=True)
          doc.close()
          out.replace(pdf)
          PY
          sha256sum output/pdf/Litt_Problem_13_F4.pdf > SHA256SUMS.txt
      - name: Verify and render after
        run: |
          pdftotext output/pdf/Litt_Problem_13_F4.pdf /tmp/f4.txt
          test "$(grep -Fc 'Prepared with assistance from OpenAI.' /tmp/f4.txt)" = 1
          ! grep -Fq 'AI-assisted tools were used during manuscript preparation.' /tmp/f4.txt
          pdftoppm -f 1 -singlefile -png -r 160 output/pdf/Litt_Problem_13_F4.pdf /tmp/f4-qa/after >/dev/null 2>&1
      - name: Upload visual QA
        uses: actions/upload-artifact@v4
        with:
          name: f4-disclosure-qa
          path: /tmp/f4-qa/*.png
      - name: Restore release description and asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > /tmp/notes.txt <<'EOF'
          I construct a complex abelian fourfold and an integral surface whose full convolution Tannaka group is the simple group of type F4. I begin with the Fano surface of lines on a smooth cubic threefold with an Eckardt point, quotient its Albanese variety by the elliptic curve of lines through that point, and analyze the resulting intersection complex. The pushforward decomposition and the restriction 27 = 1 + 26 reduce the final identification to the geometry of the Albert representation and the subgroup structure of F4.

          Written with the assistance of OpenAI's GPT-5.6-sol model.
          EOF
          gh release edit v1.0.0-preprint --notes-file /tmp/notes.txt
          gh release delete-asset v1.0.0-preprint Litt_Problem_13_F4.pdf -y
          gh release upload v1.0.0-preprint output/pdf/Litt_Problem_13_F4.pdf --clobber
      - name: Commit restored PDF and remove workflow
        run: |
          rm -f .github/workflows/restore-original-disclosure.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Restore original F4 disclosure'
          git push
