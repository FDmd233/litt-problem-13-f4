name: Final context cleanup

on:
  push:
    paths:
      - '.github/workflows/final-context-cleanup.yml'

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install PDF tools
        run: |
          python3 -m pip install --quiet pymupdf
          sudo apt-get update -qq
          sudo apt-get install -y -qq poppler-utils ripgrep
      - name: Replace branded assistance sentence
        run: |
          python3 - <<'PY'
          import fitz
          from pathlib import Path
          pdf='output/pdf/Litt_Problem_13_F4.pdf'
          old='Prepared with assistance from OpenAI.'
          new='AI-assisted tools were used during manuscript preparation.'
          doc=fitz.open(pdf)
          hits=0
          for page in doc:
              rects=page.search_for(old)
              for r in rects:
                  hits += 1
                  size=9.0
                  for block in page.get_text('dict')['blocks']:
                      for line in block.get('lines',[]):
                          for span in line.get('spans',[]):
                              if 'Prepared with assistance' in span.get('text',''):
                                  size=float(span.get('size',9.0))
                  rr=fitz.Rect(r.x0-1, r.y0-1, min(page.rect.x1-24, r.x0+(r.width*1.55)), r.y1+2)
                  page.add_redact_annot(rr, fill=(1,1,1))
                  page.apply_redactions()
                  fs=max(6.0, size*0.78)
                  result=page.insert_textbox(rr, new, fontsize=fs, fontname='helv', color=(0,0,0), align=fitz.TEXT_ALIGN_LEFT)
                  if result < 0:
                      raise RuntimeError(f'replacement did not fit: {result}')
          if hits != 1:
              raise RuntimeError(f'expected exactly one assistance sentence, found {hits}')
          out='/tmp/after.pdf'
          doc.save(out, garbage=4, deflate=True)
          doc.close()
          Path(out).replace(pdf)
          p=Path('README.md')
          s=p.read_text(encoding='utf-8').replace(old,new)
          p.write_text(s,encoding='utf-8')
          PY
          sha256sum output/pdf/Litt_Problem_13_F4.pdf > SHA256SUMS.txt
      - name: Verify PDF text
        run: |
          pdftotext output/pdf/Litt_Problem_13_F4.pdf /tmp/f4.txt
          grep -F 'AI-assisted tools were used during manuscript preparation.' /tmp/f4.txt
          if rg -n -i 'OpenAI|ChatGPT|GPT[- ]?[0-9]|Claude|Astra|Aristotle|undergraduate|thesis|defense|public version|private version|our conversation|chat history|prompt' /tmp/f4.txt README.md; then
            echo 'Forbidden context remains' >&2
            exit 1
          fi
      - name: Commit cleanup
        run: |
          rm -f .github/workflows/conversation-trace-audit.yml .github/workflows/final-context-cleanup.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Use neutral assistance disclosure in F4 manuscript'
          git push
