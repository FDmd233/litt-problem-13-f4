name: Restore tagged F4 artifact

on:
  push:
    paths:
      - '.github/workflows/restore-tagged-f4-artifact.yml'

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository with tags
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore PDF from tagged snapshot
        shell: bash
        run: |
          git show 'v1.0.0-preprint:output/pdf/Litt_Problem_13_F4.pdf' > output/pdf/Litt_Problem_13_F4.pdf
          printf '%s  %s\n' '204aa10eb914883b72eab74b2f86ddef5516af578f3fd8a473086479255d539a' 'output/pdf/Litt_Problem_13_F4.pdf' > SHA256SUMS.txt
          sha256sum -c SHA256SUMS.txt

      - name: Restore release asset
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release delete-asset v1.0.0-preprint Litt_Problem_13_F4.pdf -y
          gh release upload v1.0.0-preprint output/pdf/Litt_Problem_13_F4.pdf --clobber

      - name: Commit tagged artifact and remove workflow
        shell: bash
        run: |
          rm -f .github/workflows/restore-tagged-f4-artifact.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Restore F4 tagged artifact'
          git push
