name: Verify Albert Hessian ranks
on:
  push:
    branches: [main]
    paths:
      - 'verification/**'
      - 'Litt_Problem_13_F4.tex'
      - '.github/workflows/verify-albert-hessian.yml'
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  hessian-rank:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned SymPy
        run: python -m pip install 'sympy==1.14.0'
      - name: Exact Albert rank-one and rank-two Hessian check
        run: python verification/verify_albert_hessian.py
